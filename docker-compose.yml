services:
  elvex-api:
    image: elvex-api:latest
    
    build:
      context: .
      dockerfile: Dockerfile

    container_name: elvex-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./outputs:/app/outputs

    restart: unless-stopped

  elvex-studio:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: elvex-studio

    ports:
      - "5173:80"

    depends_on:
      - elvex-api

    restart: unless-stopped
